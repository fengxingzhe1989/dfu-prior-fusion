source_config_policy: 'resolve and hash before training; verify exact filenames and variant semantics; missing file is a preflight stop, not permission to silently substitute'
neutral:
  source_architecture: full_lpt
  prior_probability: 0.5
  roi: full_rgb_image
  stats: [0.5, 0.5, 1.0, 0.5]
  alignment_target: constant_0_5
  preserve_constant_after_augmentation: true
  preserve_all_heads_and_loss_weights: true
stacking:
