  evaluation_grids_width_height: [[512, 384], [224, 224]]
  replace_classification_prior: false
statistics:
  primary: mean_across_seed_pooled_oof_macro_f1_difference
  contrasts: [full_minus_neutral, ra_minus_output_only, rgb_prior_minus_rgb]
  multiplicity: holm_across_three_new_contrasts_if_p_values_reported
  bootstrap: {replicates: 5000, unit: paired_seed_crossed_with_similarity_group, interval: percentile_95}
