  ra_lpt_features: 151
  strong_rgb_features: 53
  strong_rgb_prior_features: 103
  C_grid: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  class_weights: [null, balanced]
  bias_steps: [0.5, 0.25, 0.1, 0.05]
  bias_bounds: [-2.0, 2.0]
  tune_bias: true
  inner_selection_score_is_independent_validation: false
  test_fold_never_used_for_feature_generation_training_or_selection: true
segmentation_audit:
  seed_count: 5
  outer_folds: 5
  inner_stop: 'KFold(5, shuffle=True, random_state=split_seed+outer_fold), fold0; restrict to outer-train'
