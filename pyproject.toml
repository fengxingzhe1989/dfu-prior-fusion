[project]
name = "dfu-prior-fusion"
version = "0.1.0"
description = "Reliability-aware cross-dataset lesion-prior experiments for diabetic foot ulcer classification."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "albumentations>=2.0.6,<3",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pillow>=11,<12",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "segmentation-models-pytorch>=0.4.0,<0.5",
  "tensorboard>=2.18,<3",
  "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
notebook = [
  "ipywidgets>=8.1,<9",
  "jupyterlab>=4.4,<5",
]

[tool.uv]
package = false
